[project]
name = "spendcube"
version = "0.1.0"
description = "Spendcube"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "openpyxl",
    "python-dotenv",
    "sqlalchemy",
    "asana",
    "jinja2",          # used by reports/build.py (HTML reports)
    # "boto3",            # AWS
    # "psycopg2-binary",  # database driver: pick the one for your database
    # Shared toolkit: pinned by the cida-toolkit skill once the repo URL is set. Never list the bare
    # name "cida_toolkit" here: pip would look it up on PyPI. While developing it is installed with
    # pip install -e C:\Users\<you>\dev\toolkit
    # "cida_toolkit @ git+https://github.com/<owner>/cida_toolkit@vX.Y.Z",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "nbstripout", "ipykernel", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "reports/tests"]
pythonpath = ["src"]
